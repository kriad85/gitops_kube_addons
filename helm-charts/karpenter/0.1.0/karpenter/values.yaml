# =====================================================================
# GENERAL METADATA
# =====================================================================
nameOverride: ""
fullnameOverride: ""
additionalLabels: {}
additionalAnnotations: {}

# =====================================================================
# SERVICE ACCOUNT
# =====================================================================
serviceAccount:
  create: true
  name: ""
  annotations: {}

# =====================================================================
# CONTROLLER DEPLOYMENT
# =====================================================================
imagePullPolicy: IfNotPresent
imagePullSecrets: []
replicas: 2
revisionHistoryLimit: 10

podLabels: {}
podAnnotations: {}

podSecurityContext:
  fsGroup: 65532

priorityClassName: system-cluster-critical
terminationGracePeriodSeconds: 30
hostNetwork: false
dnsPolicy: ClusterFirst

nodeSelector:
  kubernetes.io/os: linux

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: karpenter.sh/nodepool
              operator: DoesNotExist
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - topologyKey: "kubernetes.io/hostname"

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule

tolerations:
  - key: CriticalAddonsOnly
    operator: Exists

# =====================================================================
# POD DISRUPTION BUDGET
# =====================================================================
podDisruptionBudget:
  name: karpenter
  maxUnavailable: 1

# =====================================================================
# CONTROLLER CONFIGURATION
# =====================================================================
controller:
  image:
    repository: ocir.us-ashburn-1.oci.oraclecloud.com/idkx1lfgxgf7/karpenter/karpenter-oci/controller
    tag: 1.4.1
    digest: sha256:f9857b6468c0c363d05f01a442bb944c214a4ac7b0920660c9c35f8fb485ea76
  env: []
  envFrom: []
  resources: {}
  extraVolumeMounts: []
  sidecarContainer: []
  sidecarVolumeMounts: []
  metrics:
    port: 8080
  healthProbe:
    port: 8081

# =====================================================================
# WEBHOOK
# =====================================================================
webhook:
  enabled: false
  port: 8443
  metrics:
    port: 8001

# =====================================================================
# LOGGING
# =====================================================================
logLevel: info
logOutputPaths:
  - stdout
logErrorOutputPaths:
  - stderr

# =====================================================================
# GLOBAL KARPENTER SETTINGS
# =====================================================================
settings:
  # Core OKE / OCI parameters (required)
  clusterName: karpenter-oci-test
  clusterEndpoint: https://141.147.53.65:6443:6443
  clusterDns: 10.96.5.5
  compartmentId: ocid1.compartment.oc1..aaaaaaaay7cdwscqmocjddiq7toywx5gnje7g4swot3pzeclakfn7zzmazta
  ociResourcePrincipalRegion: eu-frankfurt-1
  tagNamespace: oke-karpenter-ns

  # Resource principal and authentication
  ociResourcePrincipalVersion: "2.2"
  ociAuthMethods: "OKE"

  # Compute Flex shape constraints
  flexCpuConstrainList: "1,2,4,8,16,32,48,64,96,128"
  flexCpuMemRatios: "2,4,8"

  # Provisioning behaviour
  batchMaxDuration: 10s
  batchIdleDuration: 1s
  vmMemoryOverheadPercent: 0.075

  # Feature gates
  featureGates:
    spotToSpotConsolidation: false

# =====================================================================
# OCI SPECIFIC RESOURCES (ADDED)
# =====================================================================
ocinodeclass:
  enabled: true
  name: default
  imageFamily: OracleOKELinux
  image: Oracle-Linux-8.10-OKE-1.34.1-1191-CUSTOM
  sshKey: "ssh-rsa  Karim@kriad-8XJ91C4"
  vcnId: ocid1.vcn.oc1.eu-frankfurt-1.amaaaaaabipy4zqay4f7fmhpt3xaxowhwiuo6ygktkqlpo27c36au255wmdq
  subnetName: PrivateSubnetB
  nsgName: oke-endpoint-nsg
  bootVolumeSizeGB: 100
  bootVolumeVpusPerGB: 10
  okeNativePodNetworking: true
  kubelet:
    evictionHard:
      memory.available: "750Mi"
      nodefs.available: "10%"
    systemReserved:
      memory: "100Mi"

# =====================================================================
# NODE POOL SPECIFICATION (ADDED)
# =====================================================================
nodepool:
  enabled: true
  name: default
  shape: VM.Standard.E4.Flex
  cpu: 64
  memory: 300Gi
  cpuOptions: [ "4", "8", "16" ]
  consolidateAfter: 30m
  disruptionBudget:
    nodes: 10%
  labels:
    servicegroup: default
  capacityType: on-demand