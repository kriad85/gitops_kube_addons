# -- Overrides the chart's name.
nameOverride: ""
# -- Overrides the chart's computed fullname.
fullnameOverride: ""
# -- Additional labels to add into metadata.
additionalLabels: {}
# app: karpenter

# -- Additional annotations to add into metadata.
additionalAnnotations: {}
# -- Image pull policy for Docker images.
imagePullPolicy: IfNotPresent
# -- Image pull secrets for Docker images.
imagePullSecrets: []
serviceAccount:
  # -- Specifies if a ServiceAccount should be created.
  create: true
  # -- The name of the ServiceAccount to use.
  # If not set and create is true, a name is generated using the fullname template.
  name: ""
  # -- Additional annotations for the ServiceAccount.
  annotations: {}
# -- Specifies additional rules for the core ClusterRole.
additionalClusterRoleRules: []
serviceMonitor:
  # -- Specifies whether a ServiceMonitor should be created.
  enabled: false
  # -- Additional labels for the ServiceMonitor.
  additionalLabels: {}
  # -- Configuration on `http-metrics` endpoint for the ServiceMonitor.
  # Not to be used to add additional endpoints.
  # See the Prometheus operator documentation for configurable fields https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/api.md#endpoint
  endpointConfig: {}
# -- Number of replicas.
replicas: 2
# -- The number of old ReplicaSets to retain to allow rollback.
revisionHistoryLimit: 10
# -- Strategy for updating the pod.
strategy:
  rollingUpdate:
    maxUnavailable: 1
# -- Additional labels for the pod.
podLabels: {}
# -- Additional annotations for the pod.
podAnnotations: {}
podDisruptionBudget:
  name: karpenter
  maxUnavailable: 1
# -- SecurityContext for the pod.
podSecurityContext:
  fsGroup: 65532
# -- PriorityClass name for the pod.
priorityClassName: system-cluster-critical
# -- Override the default termination grace period for the pod.
terminationGracePeriodSeconds:
# -- Bind the pod to the host network.
# This is required when using a custom CNI.
hostNetwork: false
# -- Configure the DNS Policy for the pod
dnsPolicy: ClusterFirst
# -- Configure DNS Config for the pod
dnsConfig: {}
#  options:
#    - name: ndots
#      value: "1"
# -- Node selectors to schedule the pod to nodes with labels.
nodeSelector:
  kubernetes.io/os: linux
# -- Affinity rules for scheduling the pod. If an explicit label selector is not provided for pod affinity or pod anti-affinity one will be created from the pod selector labels.
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: karpenter.sh/nodepool
              operator: DoesNotExist
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - topologyKey: "kubernetes.io/hostname"
# -- Topology spread constraints to increase the controller resilience by distributing pods across the cluster zones. If an explicit label selector is not provided one will be created from the pod selector labels.
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
# -- Tolerations to allow the pod to be scheduled to nodes with taints.
tolerations:
  - key: CriticalAddonsOnly
    operator: Exists
# -- Additional volumes for the pod.
extraVolumes: []
controller:
  image:
    # -- Repository path to the controller image.
    repository: ocir.us-ashburn-1.oci.oraclecloud.com/idkx1lfgxgf7/karpenter/karpenter-oci/controller
    # -- Tag of the controller image.
    tag: 1.4.1
    # -- SHA256 digest of the controller image.
    digest: sha256:f9857b6468c0c363d05f01a442bb944c214a4ac7b0920660c9c35f8fb485ea76
  # -- Additional environment variables for the controller pod.
  env: []
  envFrom: []
  # -- Resources for the controller pod.
  resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  #  requests:
  #    cpu: 1
  #    memory: 1Gi
  #  limits:
  #    cpu: 1
  #    memory: 1Gi

  # -- Additional volumeMounts for the controller pod.
  extraVolumeMounts: []
  sidecarContainer: []
  # -- Additional volumeMounts for the sidecar - this will be added to the volume mounts on top of extraVolumeMounts
  sidecarVolumeMounts: []
  metrics:
    # -- The container port to use for metrics.
    port: 8080
  healthProbe:
    # -- The container port to use for http health probe.
    port: 8081
webhook:
  # -- Whether to enable the webhooks and webhook permissions.
  enabled: false
  # -- The container port to use for the webhook.
  port: 8443
  metrics:
    # -- The container port to use for webhook metrics.
    port: 8001
# -- Global log level, defaults to 'info'
logLevel: info
# -- Log outputPaths - defaults to stdout only
logOutputPaths:
  - stdout
# -- Log errorOutputPaths - defaults to stderr only
logErrorOutputPaths:
  - stderr
# -- Global Settings to configure Karpenter
settings:
  # Core OKE / OCI parameters (required)
  clusterName: karpenter-oci-test
  clusterEndpoint: https://141.147.53.65:6443:6443
  clusterDns: 10.96.5.5
  compartmentId: ocid1.compartment.oc1..aaaaaaaay7cdwscqmocjddiq7toywx5gnje7g4swot3pzeclakfn7zzmazta
  ociResourcePrincipalRegion: eu-frankfurt-1
  tagNamespace: oke-karpenter-ns

  # Resource principal and authentication
  ociResourcePrincipalVersion: "2.2"
  ociAuthMethods: "OKE"

  # Compute Flex shape constraints
  flexCpuConstrainList: "1,2,4,8,16,32,48,64,96,128"
  flexCpuMemRatios: "2,4,8"

  # Provisioning behaviour
  batchMaxDuration: 10s
  batchIdleDuration: 1s
  vmMemoryOverheadPercent: 0.075

  # Feature gates
  featureGates:
    spotToSpotConsolidation: false

# =====================================================================
# OCI SPECIFIC RESOURCES (ADDED)
# =====================================================================
ocinodeclass:
  enabled: true
  name: default
  imageFamily: OracleOKELinux
  image: Oracle-Linux-8.10-OKE-1.34.1-1191-CUSTOM
  sshKey: "ssh-rsa  Karim@kriad-8XJ91C4"
  vcnId: ocid1.vcn.oc1.eu-frankfurt-1.amaaaaaabipy4zqay4f7fmhpt3xaxowhwiuo6ygktkqlpo27c36au255wmdq
  subnetName: PrivateSubnetB
  nsgName: oke-endpoint-nsg
  bootVolumeSizeGB: 100
  bootVolumeVpusPerGB: 10
  okeNativePodNetworking: true
  kubelet:
    evictionHard:
      memory:
        available: "750Mi"
      nodefs:
        available: "10%"
    systemReserved:
      memory: "100Mi"

# =====================================================================
# NODE POOL SPECIFICATION (ADDED)
# =====================================================================
nodepool:
  enabled: true
  name: default
  shape: VM.Standard.E4.Flex
  cpu: 64
  memory: 300Gi
  cpuOptions: [ "4", "8", "16" ]
  consolidateAfter: 30m
  disruptionBudget:
    nodes: 10%
  labels:
    servicegroup: default
  capacityType: on-demand