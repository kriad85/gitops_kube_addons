apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/kriad85/gitops_kube_addons
    targetRevision: main
    path: helm-charts/kube-prometheus-stack
    chart: kube-prometheus-stack    # <<<<<< FIXED (this was missing)
    helm:
      releaseName: prom
      valueFiles:
        - values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true